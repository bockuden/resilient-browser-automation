name: Release worker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate SemVer tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer tag such as v1.2.3 or v1.2.3-rc.1; got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: release-nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            release-nuget-${{ runner.os }}-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Analyzer and formatting check
        run: dotnet format --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test tests/Automation.UnitTests/Automation.UnitTests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/Automation.IntegrationTests/Automation.IntegrationTests.csproj --configuration Release --no-build

      - name: Full Chromium Compose E2E
        shell: pwsh
        run: ./eng/demo-compose.ps1

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-verification-${{ github.ref_name }}
          path: artifacts/docker-demo/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Define image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Resilient Browser Automation
            org.opencontainers.image.description=Production-style C# browser automation worker

      - name: Build and publish worker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/Automation.Worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: resilient-browser-automation-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Resilient Browser Automation ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: resilient-browser-automation-${{ github.ref_name }}.spdx.json
          body: |
            Container image:
            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            Image digest:
            `${{ steps.build.outputs.digest }}`

            The tag passed the complete .NET and Chromium Compose verification
            before the image, SBOM, and release were published.
