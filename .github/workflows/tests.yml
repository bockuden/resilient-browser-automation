name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Analyzer and formatting check
        run: dotnet format --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test tests/Automation.UnitTests/Automation.UnitTests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/Automation.IntegrationTests/Automation.IntegrationTests.csproj --configuration Release --no-build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build worker
        run: dotnet build src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-restore

      - name: Install Chromium for Playwright
        run: pwsh src/Automation.Worker/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Pull deterministic target
        run: docker compose pull demo-site

      - name: Start deterministic target
        run: docker compose up --detach --wait demo-site

      - name: Reset target counters
        run: curl --fail --request POST http://localhost:8080/admin/reset

      - name: Successful extraction
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.success.jsonl

      - name: Idempotent repeated delivery
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.success.jsonl

      - name: Transient retry recovery
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.transient.jsonl

      - name: Natural catalog end
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.natural-end.jsonl

      - name: Create resumable failure after page 2
        shell: bash
        run: |
          set +e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.resume.fail.jsonl
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 3 ]; then
            echo "Expected resumable failure exit code 3, got $exit_code"
            exit 1
          fi

      - name: Verify durable checkpoint before resume
        run: |
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              checkpoint = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()
              item_count = connection.execute(
                  "select count(*) from catalog_items where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()[0]
          assert checkpoint == (2,), checkpoint
          assert item_count == 10, item_count
          PY

      - name: Resume from page 3
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.resume.success.jsonl

      - name: Graceful cancellation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          Automation__Concurrency__ShutdownGracePeriodSeconds=1 \
            dotnet src/Automation.Worker/bin/Release/net10.0/Automation.Worker.dll \
            --jobs samples/jobs.playwright.cancel.jsonl \
            > artifacts/cancellation.log 2>&1 &
          worker_pid=$!
          sleep 4
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          exit_code=$?
          set -e
          cat artifacts/cancellation.log
          if [ "$exit_code" -ne 4 ]; then
            echo "Expected cancellation exit code 4, got $exit_code"
            exit 1
          fi

      - name: Verify E2E persistence
        run: |
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              natural_end = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-natural-end",),
              ).fetchone()
              resumed = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()
              resumed_items = connection.execute(
                  "select count(*) from catalog_items where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()[0]
              cancelled = connection.execute(
                  "select status from jobs where job_id = ?",
                  ("catalog-playwright-cancel",),
              ).fetchone()
              page_range = connection.execute(
                  "select min(page_number), max(page_number) from catalog_items"
              ).fetchone()
          assert natural_end == (4,), natural_end
          assert resumed == (4,), resumed
          assert resumed_items == 20, resumed_items
          assert cancelled == ("Cancelled",), cancelled
          assert page_range == (1, 4), page_range
          PY

      - name: Permanent failure evidence
        shell: bash
        run: |
          set +e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.permanent.jsonl
          exit_code=$?
          if [ "$exit_code" -ne 3 ]; then
            echo "Expected worker exit code 3, got $exit_code"
            exit 1
          fi

      - name: Stop pinned Test Stand before the 1.2.0 compatibility check
        run: docker compose down

      - name: Pull Test Stand 1.2.0
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: docker compose pull demo-site

      - name: Start Test Stand 1.2.0
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: docker compose up --detach --wait demo-site

      - name: Recover from rate limiting using Retry-After
        shell: pwsh
        run: |
          $output = & dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.rate-limit.jsonl 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Rate-limit worker returned exit code $exitCode; expected 0."
          }
          $summaryLine = $output | Where-Object { $_ -match '^\s*\{"completedJobs":' } | Select-Object -Last 1
          if (-not $summaryLine) {
            throw "Rate-limit worker did not emit its JSON run summary."
          }
          $summary = $summaryLine | ConvertFrom-Json
          if ($summary.completedJobs -ne 1 -or $summary.retriesScheduled -ne 6) {
            throw "Rate-limit run summary reported $($summary.completedJobs) completed jobs and $($summary.retriesScheduled) retries; expected 1 job and 6 retries."
          }
          $retryWaits = @($output | Where-Object { $_ -match 'Retry \d+ scheduled after 1000 ms' })
          if ($retryWaits.Count -ne 6) {
            throw "Rate-limit run recorded $($retryWaits.Count) one-second retry waits; expected 6."
          }

      - name: Verify rate-limit checkpoint and persisted items
        run: |
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              checkpoint = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-rate-limit",),
              ).fetchone()
              item_count = connection.execute(
                  "select count(*) from catalog_items where job_id = ?",
                  ("catalog-playwright-rate-limit",),
              ).fetchone()[0]
              status = connection.execute(
                  "select status from jobs where job_id = ?",
                  ("catalog-playwright-rate-limit",),
              ).fetchone()
          assert checkpoint == (3,), checkpoint
          assert item_count == 15, item_count
          assert status == ("Completed",), status
          PY

      - name: Re-authenticate and resume after session expiry
        shell: pwsh
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: |
          $output = & dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.session-expiry.jsonl 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Session-expiry worker returned exit code $exitCode; expected 0."
          }
          if (($output -join "`n") -match '(?i)(?:[?&](?:username=demo|password=automation)|demo_session=authenticated)') {
            throw "Session-expiry logs exposed credentials or an authenticated-session cookie."
          }
          $summaryLine = $output | Where-Object { $_ -match '^\s*\{"completedJobs":' } | Select-Object -Last 1
          if (-not $summaryLine) {
            throw "Session-expiry worker did not emit its JSON run summary."
          }
          $summary = $summaryLine | ConvertFrom-Json
          if ($summary.completedJobs -ne 1 -or $summary.retriesScheduled -ne 0) {
            throw "Session-expiry run reported $($summary.completedJobs) completed jobs and $($summary.retriesScheduled) retries; expected 1 completed job without job retries."
          }
          $loginEvents = @($output | Where-Object { $_ -match 'Authenticated protected catalog session' })
          if ($loginEvents.Count -ne 2) {
            throw "Session-expiry run recorded $($loginEvents.Count) successful authentications; expected the initial login and one re-authentication."
          }

      - name: Verify resumed page and persisted checkpoints
        run: |
          python - <<'PY'
          import sqlite3
          job_id = "catalog-playwright-session-expiry"
          with sqlite3.connect("artifacts/automation.db") as connection:
              checkpoint = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  (job_id,),
              ).fetchone()
              page_counts = connection.execute(
                  "select page_number, count(*) from catalog_items where job_id = ? group by page_number order by page_number",
                  (job_id,),
              ).fetchall()
              status = connection.execute(
                  "select status from jobs where job_id = ?",
                  (job_id,),
              ).fetchone()
              attempt_count = connection.execute(
                  "select count(*) from job_attempts where job_id = ?",
                  (job_id,),
              ).fetchone()[0]
          assert checkpoint == (4,), checkpoint
          assert page_counts == [(1, 5), (2, 5), (3, 5), (4, 5)], page_counts
          assert status == ("Completed",), status
          assert attempt_count == 1, attempt_count
          PY

      - name: Verify selector failure recovery matrix
        shell: bash
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: |
          set +e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.selector-failures.jsonl > selector-failures.log 2>&1
          exit_code=$?
          set -e
          cat selector-failures.log
          if [ "$exit_code" -ne 3 ]; then
            echo "Selector-failure matrix returned exit code $exit_code; expected 3 for its deliberate terminal failures."
            exit 1
          fi
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          successes = {"missing", "changed", "delayed"}
          targets = {"login-button", "item", "next-page"}
          modes = {"missing", "changed", "multiple", "delayed", "hidden", "disabled"}
          completed = failed = 0
          with sqlite3.connect("artifacts/automation.db") as connection:
              for target in targets:
                  for mode in modes:
                      job_id = f"selector-{target}-{mode}"
                      row = connection.execute(
                          "select status, error_message from jobs where job_id = ?", (job_id,)
                      ).fetchone()
                      assert row is not None, f"missing job {job_id}"
                      if mode in successes:
                          completed += 1
                          assert row == ("Completed", None), (job_id, row)
                          item_count = connection.execute(
                              "select count(*) from catalog_items where job_id = ?", (job_id,)
                          ).fetchone()[0]
                          assert item_count == 10, (job_id, item_count)
                      else:
                          failed += 1
                          assert row[0] == "Failed" and row[1], (job_id, row)
                          expected_message = {
                              "multiple": ("matched 2 elements", "duplicate item id"),
                              "hidden": ("hidden",),
                              "disabled": ("disabled",),
                          }[mode]
                          assert any(message in row[1].lower() for message in expected_message), (job_id, row)
                          evidence = Path("artifacts") / job_id / "1"
                          assert all((evidence / name).is_file() for name in (
                              "error.json", "page.html", "screenshot.png", "trace.zip"
                          )), (job_id, list(evidence.glob("*")))
          assert (completed, failed) == (9, 9), (completed, failed)
          PY

      - name: Stop selector scenario target
        run: docker compose down

      - name: Start target with custom selector tokens
        shell: bash
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: |
          docker compose run --detach --name selector-config-stand --publish 8080:8080 \
            --volume "$PWD/eng/selector-tokens.toml:/app/selectors.toml:ro" demo-site \
            automation-test-stand --host 0.0.0.0 --port 8080 --config /app/selectors.toml
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/health

      - name: Verify custom selector tokens
        shell: bash
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: |
          set +e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.custom-selectors.jsonl > custom-selectors.log 2>&1
          exit_code=$?
          set -e
          cat custom-selectors.log
          if [ "$exit_code" -ne 0 ]; then
            echo "Custom selector-token job returned exit code $exit_code; expected 0."
            exit 1
          fi
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              checkpoint = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-custom-selectors",),
              ).fetchone()
              item_count = connection.execute(
                  "select count(*) from catalog_items where job_id = ?",
                  ("catalog-playwright-custom-selectors",),
              ).fetchone()[0]
              status = connection.execute(
                  "select status from jobs where job_id = ?",
                  ("catalog-playwright-custom-selectors",),
              ).fetchone()
          assert checkpoint == (4,), checkpoint
          assert item_count == 20, item_count
          assert status == ("Completed",), status
          PY

      - name: Stop custom selector target
        if: always()
        run: docker rm --force selector-config-stand || true

      - name: Start Test Stand 1.2.0 for malformed response scenarios
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: docker compose up --detach --wait demo-site

      - name: Verify malformed API response handling
        shell: bash
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: |
          set +e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.malformed-api.jsonl > malformed-api.log 2>&1
          exit_code=$?
          set -e
          cat malformed-api.log
          if [ "$exit_code" -ne 3 ]; then
            echo "Malformed API scenarios returned exit code $exit_code; expected 3 for their deliberate contract failures."
            exit 1
          fi
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          expected_reasons = {
              "invalid-json": "response body is not valid JSON",
              "truncated-json": "response body is not valid JSON",
              "wrong-content-type": "expected Content-Type application/json",
              "missing-fields": "response must contain an items array",
              "wrong-field-type": "response must contain an items array",
          }
          with sqlite3.connect("artifacts/automation.db") as connection:
              for mode, expected_reason in expected_reasons.items():
                  job_id = f"malformed-api-{mode}"
                  status, error_message = connection.execute(
                      "select status, error_message from jobs where job_id = ?", (job_id,)
                  ).fetchone()
                  assert status == "Failed", (job_id, status)
                  assert expected_reason in error_message, (job_id, error_message)
                  item_count = connection.execute(
                      "select count(*) from catalog_items where job_id = ?", (job_id,)
                  ).fetchone()[0]
                  checkpoint = connection.execute(
                      "select last_completed_page from checkpoints where job_id = ?", (job_id,)
                  ).fetchone()
                  assert item_count == 0, (job_id, item_count)
                  assert checkpoint is None, (job_id, checkpoint)
                  evidence = Path("artifacts") / job_id / "1"
                  assert all((evidence / name).is_file() for name in (
                      "error.json", "page.html", "screenshot.png", "trace.zip"
                  )), (job_id, list(evidence.glob("*")))
          PY

      - name: Audit composite scenario checkpoint writes
        run: |
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              connection.executescript("""
                  CREATE TABLE composite_checkpoint_audit (
                      job_id TEXT NOT NULL,
                      page_number INTEGER NOT NULL
                  );
                  CREATE TRIGGER audit_composite_checkpoint_insert
                  AFTER INSERT ON checkpoints
                  WHEN NEW.job_id IN ('composite-playwright-a', 'composite-playwright-b')
                  BEGIN
                      INSERT INTO composite_checkpoint_audit VALUES (
                          NEW.job_id, NEW.last_completed_page
                      );
                  END;
                  CREATE TRIGGER audit_composite_checkpoint_update
                  AFTER UPDATE OF last_completed_page ON checkpoints
                  WHEN NEW.job_id IN ('composite-playwright-a', 'composite-playwright-b')
                  BEGIN
                      INSERT INTO composite_checkpoint_audit VALUES (
                          NEW.job_id, NEW.last_completed_page
                      );
                  END;
              """)
          PY

      - name: Replay composite failure sequence with fresh run IDs
        shell: bash
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: |
          set -e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.composite-events.jsonl > composite-events.log 2>&1
          cat composite-events.log
          python - <<'PY'
          import json
          from pathlib import Path
          output = Path("composite-events.log").read_text(encoding="utf-8")
          summaries = [
              json.loads(line)
              for line in output.splitlines()
              if line.startswith('{"completedJobs":')
          ]
          assert summaries[-1]["completedJobs"] == 2, summaries
          assert summaries[-1]["retriesScheduled"] == 2, summaries
          PY

      - name: Verify deterministic composite results and recovery checkpoints
        run: |
          python - <<'PY'
          import sqlite3

          expected_items = {
              **{f"item-{item:03d}": 1 for item in range(1, 6)},
              **{f"item-{item:03d}": 2 for item in range(6, 10)},
              "item-010": 3,
              **{f"item-{item:03d}": 3 for item in range(12, 16)},
              **{f"item-{item:03d}": 4 for item in range(16, 21)},
          }
          snapshots = []
          with sqlite3.connect("artifacts/automation.db") as connection:
              for job_id in ("composite-playwright-a", "composite-playwright-b"):
                  job = connection.execute(
                      "select status, error_message from jobs where job_id = ?", (job_id,)
                  ).fetchone()
                  assert job == ("Completed", None), (job_id, job)
                  checkpoint = connection.execute(
                      "select last_completed_page from checkpoints where job_id = ?", (job_id,)
                  ).fetchone()
                  assert checkpoint == (4,), (job_id, checkpoint)
                  attempt_count = connection.execute(
                      "select count(*) from job_attempts where job_id = ?", (job_id,)
                  ).fetchone()[0]
                  assert attempt_count == 1, (job_id, attempt_count)
                  items = dict(connection.execute(
                      "select external_id, page_number from catalog_items where job_id = ?",
                      (job_id,),
                  ))
                  assert items == expected_items, (job_id, items)
                  checkpoint_writes = connection.execute(
                      "select page_number from composite_checkpoint_audit where job_id = ? order by page_number",
                      (job_id,),
                  ).fetchall()
                  assert checkpoint_writes == [(1,), (2,), (3,), (4,)], (job_id, checkpoint_writes)
                  snapshots.append((checkpoint, items, attempt_count, checkpoint_writes))
          assert snapshots[0] == snapshots[1], "fresh run IDs produced different results"
          PY

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore

      - name: Stop deterministic target
        if: always()
        run: docker compose down
