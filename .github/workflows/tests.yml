name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Analyzer and formatting check
        run: dotnet format --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test tests/Automation.UnitTests/Automation.UnitTests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/Automation.IntegrationTests/Automation.IntegrationTests.csproj --configuration Release --no-build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build worker
        run: dotnet build src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-restore

      - name: Install Chromium for Playwright
        run: pwsh src/Automation.Worker/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Pull deterministic target
        run: docker compose pull demo-site

      - name: Start deterministic target
        run: docker compose up --detach --wait demo-site

      - name: Reset target counters
        run: curl --fail --request POST http://localhost:8080/admin/reset

      - name: Successful extraction
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.success.jsonl

      - name: Idempotent repeated delivery
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.success.jsonl

      - name: Transient retry recovery
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.transient.jsonl

      - name: Natural catalog end
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.natural-end.jsonl

      - name: Create resumable failure after page 2
        shell: bash
        run: |
          set +e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.resume.fail.jsonl
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 3 ]; then
            echo "Expected resumable failure exit code 3, got $exit_code"
            exit 1
          fi

      - name: Verify durable checkpoint before resume
        run: |
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              checkpoint = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()
              item_count = connection.execute(
                  "select count(*) from catalog_items where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()[0]
          assert checkpoint == (2,), checkpoint
          assert item_count == 10, item_count
          PY

      - name: Resume from page 3
        run: dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.resume.success.jsonl

      - name: Graceful cancellation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          Automation__Concurrency__ShutdownGracePeriodSeconds=1 \
            dotnet src/Automation.Worker/bin/Release/net10.0/Automation.Worker.dll \
            --jobs samples/jobs.playwright.cancel.jsonl \
            > artifacts/cancellation.log 2>&1 &
          worker_pid=$!
          sleep 4
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          exit_code=$?
          set -e
          cat artifacts/cancellation.log
          if [ "$exit_code" -ne 4 ]; then
            echo "Expected cancellation exit code 4, got $exit_code"
            exit 1
          fi

      - name: Verify E2E persistence
        run: |
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              natural_end = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-natural-end",),
              ).fetchone()
              resumed = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()
              resumed_items = connection.execute(
                  "select count(*) from catalog_items where job_id = ?",
                  ("catalog-playwright-resume",),
              ).fetchone()[0]
              cancelled = connection.execute(
                  "select status from jobs where job_id = ?",
                  ("catalog-playwright-cancel",),
              ).fetchone()
              page_range = connection.execute(
                  "select min(page_number), max(page_number) from catalog_items"
              ).fetchone()
          assert natural_end == (4,), natural_end
          assert resumed == (4,), resumed
          assert resumed_items == 20, resumed_items
          assert cancelled == ("Cancelled",), cancelled
          assert page_range == (1, 4), page_range
          PY

      - name: Permanent failure evidence
        shell: bash
        run: |
          set +e
          dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.permanent.jsonl
          exit_code=$?
          if [ "$exit_code" -ne 3 ]; then
            echo "Expected worker exit code 3, got $exit_code"
            exit 1
          fi

      - name: Stop pinned Test Stand before the 1.2.0 compatibility check
        run: docker compose down

      - name: Pull Test Stand 1.2.0
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: docker compose pull demo-site

      - name: Start Test Stand 1.2.0
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: docker compose up --detach --wait demo-site

      - name: Recover from rate limiting using Retry-After
        shell: pwsh
        run: |
          $output = & dotnet run --project src/Automation.Worker/Automation.Worker.csproj --configuration Release --no-build -- --jobs samples/jobs.playwright.rate-limit.jsonl 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Rate-limit worker returned exit code $exitCode; expected 0."
          }
          $summaryLine = $output | Where-Object { $_ -match '^\s*\{"completedJobs":' } | Select-Object -Last 1
          if (-not $summaryLine) {
            throw "Rate-limit worker did not emit its JSON run summary."
          }
          $summary = $summaryLine | ConvertFrom-Json
          if ($summary.completedJobs -ne 1 -or $summary.retriesScheduled -ne 8) {
            throw "Rate-limit run summary reported $($summary.completedJobs) completed jobs and $($summary.retriesScheduled) retries; expected 1 job and 8 retries."
          }

      - name: Verify rate-limit checkpoint and persisted items
        run: |
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("artifacts/automation.db") as connection:
              checkpoint = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  ("catalog-playwright-rate-limit",),
              ).fetchone()
              item_count = connection.execute(
                  "select count(*) from catalog_items where job_id = ?",
                  ("catalog-playwright-rate-limit",),
              ).fetchone()[0]
              status = connection.execute(
                  "select status from jobs where job_id = ?",
                  ("catalog-playwright-rate-limit",),
              ).fetchone()
          assert checkpoint == (4,), checkpoint
          assert item_count == 20, item_count
          assert status == ("Completed",), status
          PY

      - name: Re-authenticate and resume after session expiry
        shell: pwsh
        env:
          TEST_STAND_IMAGE: ghcr.io/bockuden/resilient-automation-test-stand:1.2.0
        run: |
          $output = & docker compose run --rm worker --jobs /app/samples/jobs.compose.session-expiry.jsonl 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Session-expiry worker returned exit code $exitCode; expected 0."
          }
          if (($output -join "`n") -match '(?i)(?:[?&](?:username=demo|password=automation)|demo_session=authenticated)') {
            throw "Session-expiry logs exposed credentials or an authenticated-session cookie."
          }
          $summaryLine = $output | Where-Object { $_ -match '^\s*\{"completedJobs":' } | Select-Object -Last 1
          if (-not $summaryLine) {
            throw "Session-expiry worker did not emit its JSON run summary."
          }
          $summary = $summaryLine | ConvertFrom-Json
          if ($summary.completedJobs -ne 1 -or $summary.retriesScheduled -ne 0) {
            throw "Session-expiry run reported $($summary.completedJobs) completed jobs and $($summary.retriesScheduled) retries; expected 1 completed job without job retries."
          }

      - name: Verify resumed page and persisted checkpoints
        run: |
          python - <<'PY'
          import sqlite3
          job_id = "catalog-compose-session-expiry"
          with sqlite3.connect("artifacts/automation.db") as connection:
              checkpoint = connection.execute(
                  "select last_completed_page from checkpoints where job_id = ?",
                  (job_id,),
              ).fetchone()
              page_counts = connection.execute(
                  "select page_number, count(*) from catalog_items where job_id = ? group by page_number order by page_number",
                  (job_id,),
              ).fetchall()
              status = connection.execute(
                  "select status from jobs where job_id = ?",
                  (job_id,),
              ).fetchone()
              attempt_count = connection.execute(
                  "select count(*) from job_attempts where job_id = ?",
                  (job_id,),
              ).fetchone()[0]
          assert checkpoint == (4,), checkpoint
          assert page_counts == [(1, 5), (2, 5), (3, 5), (4, 5)], page_counts
          assert status == ("Completed",), status
          assert attempt_count == 1, attempt_count
          PY

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore

      - name: Stop deterministic target
        if: always()
        run: docker compose down
