<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Resilient Browser Automation architecture</title>
  <desc id="desc">A C# worker receives jobs, persists progress in SQLite, drives Chromium through Playwright, and captures evidence on failures.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091525"/><stop offset="1" stop-color="#132b4a"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#4f8cff"/><stop offset="1" stop-color="#36d1b4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020814" flood-opacity=".45"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ea9df"/></marker><style>.label{font-family:Segoe UI,Arial,sans-serif;fill:#f5f9ff;font-weight:700}.sub{font-family:Segoe UI,Arial,sans-serif;fill:#a9c0df}.tiny{font-family:Segoe UI,Arial,sans-serif;fill:#8ca9ca;font-size:14px}.line{stroke:#7ea9df;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/><text x="64" y="74" class="label" font-size="34">Resilient Browser Automation</text><text x="64" y="108" class="sub" font-size="18">Failure-aware C# browser automation — explicit boundaries, durable progress, inspectable evidence</text>
  <g filter="url(#shadow)"><rect x="64" y="205" width="205" height="138" rx="18" fill="#142b49" stroke="#3d6491"/><circle cx="104" cy="251" r="19" fill="#4f8cff"/><path d="M94 250h20M104 240v20" stroke="#fff" stroke-width="3"/><text x="136" y="257" class="label" font-size="21">Job input</text><text x="88" y="299" class="tiny">JSON Lines · jobId · URL</text>
    <rect x="355" y="170" width="266" height="210" rx="22" fill="#13385a" stroke="url(#accent)" stroke-width="2"/><rect x="379" y="195" width="104" height="28" rx="14" fill="#36d1b4"/><text x="394" y="215" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#05231f">.NET 10</text><text x="379" y="263" class="label" font-size="25">C# Worker</text><text x="379" y="294" class="sub" font-size="16">Application job runner</text><text x="379" y="328" class="tiny">Validation · retries · cancellation</text><text x="379" y="351" class="tiny">rate limiting · correlation logs</text>
    <rect x="714" y="112" width="250" height="138" rx="18" fill="#182d4b" stroke="#6b7fa8"/><circle cx="754" cy="158" r="19" fill="#f5b941"/><text x="787" y="164" class="label" font-size="21">Playwright</text><text x="738" y="206" class="tiny">Isolated Chromium contexts</text>
    <rect x="714" y="335" width="250" height="138" rx="18" fill="#182d4b" stroke="#6b7fa8"/><circle cx="754" cy="381" r="19" fill="#a884f7"/><text x="787" y="387" class="label" font-size="21">SQLite</text><text x="738" y="429" class="tiny">Jobs · items · checkpoints</text>
    <rect x="1010" y="112" width="142" height="138" rx="18" fill="#142b49" stroke="#3d6491"/><text x="1035" y="163" class="label" font-size="19">FastAPI</text><text x="1035" y="191" class="sub" font-size="15">test stand</text><text x="1028" y="218" class="tiny">versioned image</text>
    <rect x="1010" y="335" width="142" height="138" rx="18" fill="#40202d" stroke="#e36d83"/><text x="1033" y="382" class="label" font-size="19">Evidence</text><text x="1028" y="412" class="tiny">screenshot</text><text x="1028" y="434" class="tiny">HTML · trace · JSON</text></g>
  <path class="line" d="M270 274H353"/><path class="line" d="M623 248H712"/><path class="line" d="M965 181H1008"/><path class="line" d="M621 326H712"/><path class="line" d="M965 404H1008"/><text x="733" y="544" class="sub" font-size="17">Failure path</text><path d="M600 514 C760 590 925 585 1070 492" stroke="#e36d83" stroke-width="3" fill="none" stroke-dasharray="8 9" marker-end="url(#arrow)"/><text x="65" y="600" class="tiny">Core contracts point inward. Infrastructure adapters remain replaceable and observable.</text>
</svg>
